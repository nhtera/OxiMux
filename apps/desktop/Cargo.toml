[package]
name = "oximux-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "oximux"
path = "src/main.rs"

[dependencies]
oximux-agents = { workspace = true }
# The portable half of the agent-chat core. Reached directly (rather than
# through `oximux-agents`) for the pieces that must stay compiled on every
# platform — screenshot scrubbing and the screen-tool naming contract.
oximux-agent-core = { workspace = true }
oximux-auto-update = { workspace = true }
oximux-core = { workspace = true }
oximux-dictation = { workspace = true }
oximux-editor = { workspace = true }
oximux-git = { workspace = true }
# CREATE_NO_WINDOW on every child this GUI-subsystem process spawns directly
# (rg, cleanup scripts, the relay daemon) — without it Windows pops an empty
# console window per console-subsystem child.
oximux-no-window = { workspace = true }
oximux-proc-cwd = { workspace = true }
oximux-pty = { workspace = true }
async-trait = { workspace = true }
oximux-relay-client = { workspace = true }
oximux-relay-proto = { workspace = true }
# Owner-only access on the relay auth token this process writes.
oximux-owner-only = { workspace = true }
# Remote control: the in-app iroh host (bind + accept loop) that serves the
# SessionRegistry to paired phones, its transport-agnostic dispatcher/auth, and
# the shared wire types (PairingTicket).
oximux-remote-host = { workspace = true }
oximux-remote-iroh = { workspace = true, features = ["host"] }
oximux-remote-proto = { workspace = true }
oximux-settings = { workspace = true }
oximux-storage = { workspace = true }
oximux-ui = { workspace = true }

qrcode = { workspace = true }

gpui = { workspace = true }
gpui_platform = { workspace = true }
gpui-component = { workspace = true }
gpui-component-assets = { workspace = true }

anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
image = { workspace = true }
notify-debouncer-full = { workspace = true }
regex = { workspace = true }
rfd = { workspace = true }
similar = { workspace = true }
syntect = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

# Browser cookie import (read installed browsers' cookie SQLite DBs → inject
# into the active webview profile's WKWebsiteDataStore). rusqlite reads the
# source DBs (copied to a temp dir first so a running browser's WAL lock never
# blocks us); tempfile owns that scratch dir. The RustCrypto trio decrypts
# Chromium's AES-128-CBC cookie values (key derived from the macOS Keychain
# "<Browser> Safe Storage" item via PBKDF2-HMAC-SHA1). All small, pure-Rust,
# no system crypto linkage.
rusqlite = { workspace = true }
tempfile = "3"
aes = "0.8"
cbc = "0.1"
pbkdf2 = { version = "0.12", default-features = false }
sha1 = "0.10"
hmac = "0.12"
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }

# Embedded browser-tab engine: one Rust API over the platform webview
# (WKWebView on macOS, WebView2 on Windows). `build_as_child` attaches the
# webview to GPUI's native window surface via the `raw-window-handle` already in
# the graph; no `tao`/gtk pulled in on either (those are Linux-only optional
# features). Chosen for exactly this cross-platform reach over a macOS-only
# objc2-web-kit binding. `devtools` is enabled explicitly so the inspector
# methods (open/close/is_devtools_open) exist in release too — wry only turns
# them on automatically under debug_assertions, which broke release builds.
wry = { version = "0.55", features = ["devtools"] }
# Single-instance guard: one non-blocking exclusive file lock over `flock` and
# `LockFileEx`, with contention normalised to `WouldBlock` on both.
fd-lock = "4"

# Relay supervisor's `pre_exec` calls libc::umask so the bundled
# socket/token files come out 0600. libc is already in the transitive
# graph via nix/tokio but pulling it explicitly is cheaper than the
# `libc::` qualifier dance through nix's re-exports.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Bringing the already-running instance forward: a registered broadcast message
# and the foreground-right handoff that lets the holder honour it.
[target.'cfg(windows)'.dependencies]
# Screen control, and the policing hook that is wider than it.
#
# `windows-screen-control` is what lets `mcp::server_spec` exist here, so the
# driver can be declared to an agent. It stays a feature rather than becoming
# unconditional because the crate's own tests need to be able to build the
# gated-off shape — and because turning it on is a decision about handing agents
# an unsigned third-party binary, which should be visible in a manifest rather
# than buried in a `cfg`.
#
# The hook would be warranted here even with the feature off, for a reason macOS
# does not have: synthesizing input on Windows needs no permission at all, so an
# agent's shell can drive the screen whether or not anything was opted into.
oximux-computer-use = { workspace = true, features = ["windows-screen-control"] }
widestring = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    # `SetWindowsHookExW(WH_KEYBOARD_LL, …)` and the message-pump calls the
    # Escape kill switch is built on (`escape_tap`).
    "Win32_UI_WindowsAndMessaging",
    # `SendInput`, used only by `escape_tap`'s tests to synthesize a real
    # Escape press — the one thing that proves the hook actually swallows it.
    "Win32_UI_Input_KeyboardAndMouse",
    # `Shell_NotifyIconW` — the notification-area icon that says an agent is
    # driving the screen (`screen_control_indicator`). The Windows stand-in for
    # the macOS menu-bar status item, and a weaker one; see that module.
    "Win32_UI_Shell",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Screen control drives the macOS Accessibility APIs and its installer/updater
# gates shell out to codesign and spctl. Both are macOS all the way down, so
# they leave the dependency graph entirely elsewhere rather than growing stub
# implementations. The features they back are hidden, not faked — see
# `docs/windows-port-exclusions.md`.
oximux-computer-use = { workspace = true }
oximux-macos-trust = { workspace = true }
# Objective-C bridge for the NSProcessInfo `beginActivityWithOptions`
# App Nap opt-out (`app_nap`) and the AppKit menu-item responder selectors
# (`menu::platform`). objc2 is the maintained successor and is already in the
# transitive graph (via gpui-component's objc2-foundation), so declaring it
# directly adds no new compilation — and its macros emit clean cfgs, unlike
# objc 0.2's `cfg(feature = "cargo-clippy")` expansions.
objc2 = "0.6"
# Desktop notifications (`notifier::mac`) ride UNUserNotificationCenter;
# foundation + block2 supply NSString/NSBundle and the completion-handler
# blocks. All three are already in the transitive graph via gpui-component.
objc2-foundation = { version = "0.3", features = [
  "NSUserDefaults",
  # Cookie import: build NSHTTPCookie objects from imported rows and hand
  # them to a WKHTTPCookieStore. NSURL/NSDate/NSString/NSDictionary supply
  # the cookie properties; NSArray iterates the store's existing cookies.
  "NSHTTPCookie",
  "NSURL",
  "NSDate",
  "NSString",
  "NSDictionary",
  "NSArray",
  # File-tree "Delete" moves the target to the macOS Trash via
  # `NSFileManager trashItemAtURL:` (reversible, unlike a hard unlink).
  "NSFileManager",
  "NSError",
  # Secure-input detection (`platform::secure_input`): the IORegistry's
  # `IOConsoleUsers` comes back as a toll-free-bridged CFArray of CFDictionary
  # whose secure-input pid is an NSNumber.
  "NSValue",
] }
objc2-user-notifications = "0.3"
# Voice-dictation microphone permission (`platform::mic_permission`):
# AVCaptureDevice.authorizationStatus / requestAccess(for: .audio) with a
# block2 completion handler. Same objc2 0.3 family as the app-kit/foundation
# bindings already in the graph.
objc2-av-foundation = { version = "0.3", features = [
  "AVCaptureDevice",
  "AVMediaFormat",
  "block2",
] }
block2 = "0.6"
# Browser agent-context screenshot: `WKWebView.takeSnapshot` returns an
# `NSImage`; app-kit's `NSBitmapImageRep` re-encodes it to PNG bytes for the
# clipboard. web-kit's snapshot method is feature-gated on the snapshot
# config + block2 + app-kit interop, none of which wry turns on by default,
# so they're declared here. All three crates are already in the graph (via
# wry / gpui-component) — this only flips extra feature flags, no new builds.
objc2-app-kit = { version = "0.3", features = [
  "NSImage",
  "NSImageRep",
  "NSBitmapImageRep",
  # Page color-scheme override: NSAppearanceCustomization::setAppearance on the
  # webview's NSView drives the embedded page's prefers-color-scheme.
  "NSAppearance",
  "NSResponder",
  "NSView",
  # Native toolbar dropdowns (`native_menu`): profile + page-theme pickers pop
  # as real NSMenus above the webview rather than HTML injected into the page.
  "NSMenu",
  "NSMenuItem",
  "NSEvent",
  # Screen-control indicator (`platform::screen_control_indicator`): a menu-bar
  # status item, the only surface visible while the app an agent is driving is
  # frontmost. NSStatusBarButton is an NSButton, hence the control chain.
  "NSStatusBar",
  "NSStatusItem",
  "NSStatusBarButton",
  "NSButton",
  "NSControl",
] }
objc2-web-kit = { version = "0.3", features = [
  "WKWebView",
  "WKSnapshotConfiguration",
  # Cookie import injection: reach the live webview's per-profile data store
  # (via its configuration) and push imported NSHTTPCookies into its cookie store.
  "WKWebViewConfiguration",
  "WKWebsiteDataStore",
  "WKHTTPCookieStore",
  "block2",
  "objc2-app-kit",
  "objc2-core-foundation",
] }
# `CGRect` for the element-rect snapshot region (already in the graph).
objc2-core-foundation = "0.3"

# Application icon → the executable's resource section (see build.rs). Already
# in the graph as GPUI's build-dependency, so this adds a manifest line rather
# than a compile.
#
# Deliberately NOT under `cfg(windows)`: build-dependencies resolve against the
# *host*, so a cross-compile from macOS to Windows would drop the crate while
# build.rs — which keys off the target — still called it, and the failure would
# be "unresolved import" in a build script. On a non-Windows host the crate
# compiles to a stub that reports `NotWindows`, so the cost of leaving it in is
# nil.
[build-dependencies]
embed-resource = "3"

[dev-dependencies]
# Decodes the rendered pairing QR back to its payload, so the code is proven
# *scannable* rather than merely well-shaped — the only way to verify that
# without a phone.
rqrr = "0.9"
gpui = { workspace = true, features = ["test-support"] }
gpui_macros = { workspace = true }
tempfile = "3"
