[package]
name = "oximux-relay-supervisor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Ensures an `oximux-relay` daemon is alive and hands back a connected
# `RelayClient` — extracted from the desktop app (where it lived with zero
# gpui imports) so `oximux serve` can supervise the same daemon with the same
# detach recipes, version-mismatch handling, and poll-connect retry. The
# desktop consumes this crate through its old module path, so both hosts run
# one supervisor, not two forks.

[dependencies]
oximux-relay-client = { workspace = true }
oximux-relay-proto = { workspace = true }
oximux-owner-only = { workspace = true }
oximux-no-window = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

# `pre_exec` calls libc::umask so the daemon's socket/token files come out
# 0600, and the PID watch calls waitpid/kill directly.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
