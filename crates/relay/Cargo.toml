[package]
name = "oximux-relay"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "oximux-relay"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
oximux-proc-cwd = { workspace = true }
oximux-relay-proto = { workspace = true }
# Restricting the pid file, and — on Windows — building the named pipe's
# owner-only DACL from the same definition the token and key files use.
oximux-owner-only = { workspace = true }
oximux-shell-env = { workspace = true }
anyhow = { workspace = true }
dashmap = { workspace = true }
interprocess = { workspace = true }
portable-pty = { workspace = true }
# Handshake nonces. OsRng specifically — these must be unpredictable, and a
# replayable nonce would undo the whole point of the challenge.
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
# `user` for `User::from_uid` — the getpwuid probe in `host_lookup`. It rides in
# on nix's defaults today; naming it keeps that from becoming a silent
# compile break if anyone ever sets `default-features = false` here.
nix = { version = "0.25", features = ["signal", "user"] }

# Windows-only. `widestring` hands the pipe's security descriptor to
# `interprocess` as UTF-16; the job object is the process group's stand-in, so a
# closed terminal takes its whole process tree with it.
[target.'cfg(windows)'.dependencies]
widestring = "1"
oximux-job-object = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
tracing-oslog = { workspace = true }

[dev-dependencies]
oximux-shell-env = { workspace = true, features = ["test-support"] }
tempfile = "3"
# Integration tests run the daemon in-process, so its own tracing is the only
# window into why a pass decided what it decided. Without a subscriber those
# lines go nowhere and a failure on a machine you cannot log into tells you only
# that an expected file is absent.
tracing-subscriber = { workspace = true }
