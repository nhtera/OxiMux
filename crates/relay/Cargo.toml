[package]
name = "oximux-relay"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "oximux-relay"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
oximux-proc-cwd = { workspace = true }
oximux-relay-proto = { workspace = true }
# Restricting the pid file, and — on Windows — building the named pipe's
# owner-only DACL from the same definition the token and key files use.
oximux-owner-only = { workspace = true }
anyhow = { workspace = true }
dashmap = { workspace = true }
interprocess = { workspace = true }
portable-pty = { workspace = true }
# Handshake nonces. OsRng specifically — these must be unpredictable, and a
# replayable nonce would undo the whole point of the challenge.
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.25", features = ["signal"] }

# Windows-only. `widestring` hands the pipe's security descriptor to
# `interprocess` as UTF-16; the job object is the process group's stand-in, so a
# closed terminal takes its whole process tree with it.
[target.'cfg(windows)'.dependencies]
widestring = "1"
oximux-job-object = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
tracing-oslog = { workspace = true }

[dev-dependencies]
tempfile = "3"
