[package]
name = "oximux-relay"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "oximux-relay"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
oximux-proc-cwd = { workspace = true }
oximux-relay-proto = { workspace = true }
anyhow = { workspace = true }
dashmap = { workspace = true }
interprocess = { workspace = true }
portable-pty = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.25", features = ["signal"] }

# Building the named pipe's owner-only DACL: the token lookup that yields the
# current user's SID, and the UTF-16 string the descriptor is parsed from.
[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
tracing-oslog = { workspace = true }

[dev-dependencies]
tempfile = "3"
