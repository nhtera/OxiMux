[package]
name = "oximux-computer-use"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
oximux-agent-core.workspace = true
serde.workspace = true
# `proc_pidpath`, for resolving a granted pid back to its executable.
libc = "0.2"
serde_json.workspace = true
sha2.workspace = true
# Driver installer: staging dir for download/extract before the verified swap.
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Driver installer download (same sync client the dictation model manager uses).
ureq.workspace = true

[dev-dependencies]
# Only to run the hook matcher through a real regex engine, rather than
# asserting on the pattern text and hoping it means what it reads like.
regex.workspace = true
