[package]
name = "oximux-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "oximux"
path = "src/main.rs"

[dependencies]
oximux-agents = { workspace = true }
oximux-core = { workspace = true }
oximux-editor = { workspace = true }
oximux-git = { workspace = true }
oximux-pty = { workspace = true }
oximux-relay-client = { workspace = true }
oximux-relay-proto = { workspace = true }
oximux-settings = { workspace = true }
oximux-storage = { workspace = true }

gpui = { workspace = true }
gpui_platform = { workspace = true }
gpui-component = { workspace = true }
gpui-component-assets = { workspace = true }

anyhow = { workspace = true }
dirs = { workspace = true }
notify-debouncer-full = { workspace = true }
regex = { workspace = true }
rfd = { workspace = true }
similar = { workspace = true }
syntect = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

# Relay supervisor's `pre_exec` calls libc::umask so the bundled
# socket/token files come out 0600. libc is already in the transitive
# graph via nix/tokio but pulling it explicitly is cheaper than the
# `libc::` qualifier dance through nix's re-exports.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_macros = { workspace = true }
tempfile = "3"
