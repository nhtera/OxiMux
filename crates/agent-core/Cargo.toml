[package]
name = "oximux-agent-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# Dependency-minimal, mobile-portable core: the ThreadEvent wire vocabulary, the
# stream-json decoder, and the ChatThread fold — with NO oximux-pty / rusqlite /
# agent-client-protocol / gpui deps. Both the desktop `oximux-agents` crate and
# the phone's Rust core (`mobile-core`/`remote-session`) depend on this, so the
# fold that renders a transcript is shared verbatim across desktop and mobile.
[features]
# Transcript snapshot harness (`thread::snapshot`). Test-only: `oximux-agents`
# enables it from dev-dependencies so both crates pin transcripts with one
# harness instead of growing two. Off in every shipping build.
test-support = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# This crate's own integration test (`tests/transcript_snapshots.rs`) uses
# `thread::snapshot`, which is behind `test-support`. Without this line the
# feature reached it only by Cargo unifying features across a `--workspace`
# build, borrowed from `oximux-agents`'s dev-dependency — so `cargo test -p
# oximux-agent-core` failed to compile while CI stayed green. A crate's tests
# must not depend on which *other* crate happens to be in the same build.
oximux-agent-core = { path = ".", features = ["test-support"] }
