[package]
name = "oximux-remote-proto"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# The remote-control wire vocabulary: the append-only RPC envelope, the
# `HostEvent` stream frame, the `PairingTicket` codec, and the transport-agnostic
# `Transport` seam. Deliberately dependency-minimal — no iroh, no irpc, no tokio
# runtime, no gpui. `async-trait` is the sole async dep (a proc-macro, no
# runtime), so the crate still cross-compiles to aarch64-apple-ios /
# aarch64-linux-android with no desktop-only deps. The host (`remote-host`) and
# the phone's Rust core (`mobile-core` via `remote-session`) both speak it.
[dependencies]
oximux-agent-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { workspace = true, features = ["use-std"] }
base64 = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
# In-memory loopback `Transport` for the seam tests (a runtime-agnostic executor
# + channels; keeps tokio out of the crate). When `remote-host`'s integration
# test needs the same loopback cross-crate, promote it behind a `testing` feature.
futures = { workspace = true }
