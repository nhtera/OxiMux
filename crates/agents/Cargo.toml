[package]
name = "oximux-agents"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
oximux-core = { workspace = true }
# Portable fold + wire vocabulary + stream-json decoder, re-exported under the
# original `crate::thread::*` paths (see src/thread/mod.rs). Split out so the
# phone's Rust core can reuse the fold without pty/sqlite/ACP deps.
oximux-agent-core = { workspace = true }
oximux-pty = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
# Encodes Codex image-item file bytes (imageView/imageGeneration paths) into the
# standard-base64 `ChatImage` shape the transcript + thumbnail renderer expect.
base64 = { workspace = true }
chrono = { workspace = true }
# Read-only scan of ACP-preset agents' own SQLite session stores for the
# history/import picker: OpenCode (`~/.local/share/opencode/opencode.db`) and
# Copilot (`~/.copilot/session-store.db`). Bundled build so no system libsqlite
# is required; already a workspace dep (storage/app).
rusqlite = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# ACP (Agent Client Protocol) client — drives an external agent subprocess
# (Gemini `--experimental-acp`) over stdio. Core is stable since 1.0.0.
# `unstable_auth_methods` is enabled for the env-var / terminal `AuthMethod`
# variants the auth-flow card renders (the `Agent` variant is stable; the other
# two are gated behind this feature at the pinned schema).
agent-client-protocol = { version = "1.2", features = ["unstable_auth_methods"] }
futures = { workspace = true }

# Unix signal delivery (SIGINT to the headless `claude` child on Stop, so it
# ends the turn gracefully and checkpoints the session for a clean `--resume`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
oximux-git = { workspace = true }
# Only the schedule-store tests need this, to apply the real migrations against
# an in-memory database. The store itself takes a Connection, so the shipping
# build keeps no dependency on the storage crate.
oximux-storage = { workspace = true }
tempfile = "3"
toml = { workspace = true }

[[example]]
name = "commit_message_demo"
path = "examples/commit_message_demo.rs"

# Throwaway Phase-1 spike harness for the Claude stream-json transport (not shipped).
[[example]]
name = "stream_json_probe"
path = "examples/stream_json_probe.rs"

# Throwaway live smoke test for the ACP (Gemini) connection (not shipped).
[[example]]
name = "acp_smoke"
path = "examples/acp_smoke.rs"

# Deterministic mock ACP agent that drives the client's `terminal/*` path, and a
# headless driver that asserts the embedded-terminal flow end-to-end (not shipped).
[[example]]
name = "mock_acp_terminal_agent"
path = "examples/mock_acp_terminal_agent.rs"

[[example]]
name = "acp_terminal_smoke"
path = "examples/acp_terminal_smoke.rs"

# Deterministic mock ACP agent that parks a permission request, and a headless
# driver that asserts a client cancel resolves it with a Cancelled outcome
# instead of hanging (not shipped).
[[example]]
name = "mock_acp_cancel_agent"
path = "examples/mock_acp_cancel_agent.rs"

[[example]]
name = "acp_cancel_smoke"
path = "examples/acp_cancel_smoke.rs"

# Deterministic mock ACP agent that advertises loadSession + replays history, and
# a headless driver that asserts session/load resumes the id, suppresses the
# replayed transcript, and still renders live updates (not shipped).
[[example]]
name = "mock_acp_load_agent"
path = "examples/mock_acp_load_agent.rs"

[[example]]
name = "acp_load_smoke"
path = "examples/acp_load_smoke.rs"

# Deterministic mock ACP agent that requires auth, and a headless driver that
# asserts the client surfaces the methods, authenticates, and opens the session
# on the same connection (not shipped).
[[example]]
name = "mock_acp_auth_agent"
path = "examples/mock_acp_auth_agent.rs"

[[example]]
name = "acp_auth_smoke"
path = "examples/acp_auth_smoke.rs"

# Deterministic mock ACP agent that requires an ENV-VAR credential, and a headless
# driver that asserts the EnvVar method surfaces bare and a respawn-with-env opens
# the session (the "set env, then authenticate" flow; not shipped).
[[example]]
name = "mock_acp_env_auth_agent"
path = "examples/mock_acp_env_auth_agent.rs"

[[example]]
name = "acp_env_auth_smoke"
path = "examples/acp_env_auth_smoke.rs"
