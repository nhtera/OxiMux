[package]
name = "oximux-agents"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
oximux-core = { workspace = true }
oximux-pty = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

# Unix signal delivery (SIGINT to the headless `claude` child on Stop, so it
# ends the turn gracefully and checkpoints the session for a clean `--resume`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
oximux-git = { workspace = true }
tempfile = "3"
toml = { workspace = true }

[[example]]
name = "commit_message_demo"
path = "examples/commit_message_demo.rs"

# Throwaway Phase-1 spike harness for the Claude stream-json transport (not shipped).
[[example]]
name = "stream_json_probe"
path = "examples/stream_json_probe.rs"
