name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check + clippy + test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy

      # `target` and the sherpa-onnx prebuilts are cached as ONE entry, because
      # they only make sense together. sherpa-rs-sys downloads those libraries
      # outside `target` (into ~/Library/Caches/sherpa-rs) and bakes the path
      # into its build-script output. Caching `target` alone meant a restored
      # build script counted as fresh, so it never re-downloaded — and the link
      # failed five minutes later with `library 'onnxruntime.1.17.1' not found`,
      # which reads as a code error rather than a missing download. One entry
      # keeps the fingerprint and the files it points at in step.
      #
      # The key is versioned separately from Cargo.lock so a fix like this one
      # can invalidate entries saved under the old layout; bump `v2` whenever
      # what is cached changes, not when dependencies do.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/Library/Caches/sherpa-rs
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}

      # Insurance against the same failure returning by another route: any cache
      # that comes back with the build-script output but without the libraries
      # would link against a path that is not there. Dropping the output makes
      # cargo re-run the build script, which re-downloads them. Cheap, and it
      # turns a late linker error into a step that fixes itself.
      - name: Ensure the dictation libraries are present
        run: |
          if find ~/Library/Caches/sherpa-rs -name 'libonnxruntime*' -print -quit 2>/dev/null | grep -q .; then
            echo "sherpa-onnx prebuilts present"
          else
            echo "sherpa-onnx prebuilts absent — forcing sherpa-rs-sys to re-run"
            # `find`, not a glob: an unmatched glob is passed through literally
            # by one shell and a hard error in another, and this step must not
            # be the thing that fails the build.
            find target -type d -name 'sherpa-rs-sys-*' -exec rm -rf {} + 2>/dev/null || true
          fi

      # No `cargo fmt --check` step on purpose. This repo has no rustfmt.toml and
      # is not kept rustfmt-clean — it uses a hand-maintained style that diverges
      # from stable rustfmt defaults, so the check could never pass (it wants to
      # rewrite 417 files). A gate that is always red is not a gate; match the
      # surrounding code by hand instead.

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: xtask file-size-lint
        run: cargo run -p xtask -- file-size-lint

  # Permanent gate for the Windows port. macOS is still the only shipping
  # target, so this job checks that the workspace COMPILES for Windows — it
  # does not run tests or clippy. Its whole job is to stop a macOS-only API
  # from landing on a shared path unnoticed, which is exactly the class of
  # breakage that made the port expensive to start.
  #
  # Native runner rather than a cross-check from macOS on purpose: only a real
  # windows-msvc host surfaces link/manifest problems, and the C-dependency
  # build scripts (rusqlite's bundled sqlite, ring) need a real MSVC toolchain.
  # Locally, `cargo check --target x86_64-pc-windows-gnu` with mingw-w64 is a
  # fast proxy — `cfg(windows)` resolves identically — but `target_env` does
  # not, so this job is the authority.
  #
  # No `--all-targets`: the test targets still reach for Unix APIs directly and
  # gating them is later-phase work. Library and binary targets are the gate.
  windows-check:
    name: windows compile gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-v1-${{ hashFiles('**/Cargo.lock') }}

      # The two excluded crates are macOS-only by construction, not by
      # oversight: `macos-trust` wraps codesign/spctl and `computer-use` drives
      # the Accessibility APIs. They are workspace members, so `--workspace`
      # would still try to build them; nothing in the Windows dependency graph
      # reaches either. Adding a crate here is a decision to leave it behind on
      # Windows — do it deliberately.
      - name: cargo check
        run: >
          cargo check --workspace --target x86_64-pc-windows-msvc
          --exclude oximux-computer-use
          --exclude oximux-macos-trust
