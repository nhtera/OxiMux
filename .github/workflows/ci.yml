name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Run it by hand. Webhook delivery is not guaranteed: during a platform
  # incident it was throttled to a fraction of events, so a push and a pull
  # request both created no run at all — and with only the two triggers above,
  # there was no way to gate a merge until delivery recovered. `release.yml`
  # already carries this for the same class of reason.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check + clippy + test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy

      # `target` and the sherpa-onnx prebuilts are cached as ONE entry, because
      # they only make sense together. sherpa-rs-sys downloads those libraries
      # outside `target` (into ~/Library/Caches/sherpa-rs) and bakes the path
      # into its build-script output. Caching `target` alone meant a restored
      # build script counted as fresh, so it never re-downloaded — and the link
      # failed five minutes later with `library 'onnxruntime.1.17.1' not found`,
      # which reads as a code error rather than a missing download. One entry
      # keeps the fingerprint and the files it points at in step.
      #
      # The key is versioned separately from Cargo.lock so a fix like this one
      # can invalidate entries saved under the old layout; bump `v2` whenever
      # what is cached changes, not when dependencies do.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/Library/Caches/sherpa-rs
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}

      # Insurance against the same failure returning by another route: any cache
      # that comes back with the build-script output but without the libraries
      # would link against a path that is not there. Dropping the output makes
      # cargo re-run the build script, which re-downloads them. Cheap, and it
      # turns a late linker error into a step that fixes itself.
      - name: Ensure the dictation libraries are present
        run: |
          if find ~/Library/Caches/sherpa-rs -name 'libonnxruntime*' -print -quit 2>/dev/null | grep -q .; then
            echo "sherpa-onnx prebuilts present"
          else
            echo "sherpa-onnx prebuilts absent — forcing sherpa-rs-sys to re-run"
            # `find`, not a glob: an unmatched glob is passed through literally
            # by one shell and a hard error in another, and this step must not
            # be the thing that fails the build.
            find target -type d -name 'sherpa-rs-sys-*' -exec rm -rf {} + 2>/dev/null || true
          fi

      # No `cargo fmt --check` step on purpose. This repo has no rustfmt.toml and
      # is not kept rustfmt-clean — it uses a hand-maintained style that diverges
      # from stable rustfmt defaults, so the check could never pass (it wants to
      # rewrite 417 files). A gate that is always red is not a gate; match the
      # surrounding code by hand instead.

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets

      # Two builds of the protocol against each other: the current tree vs the
      # binary actually released. The version pins prove this build agrees
      # with itself; only this step proves it against a peer that no longer
      # exists in the tree — the released CLI drives the new host (and must
      # survive its full stream, downgrades included), and the new CLI drives
      # the released serve. The suite self-skips without OXIMUX_SKEW_CLI, so
      # the plain `cargo test` above stays hermetic.
      - name: wire-skew vs latest release
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/skew-manifest.json \
            https://github.com/${{ github.repository }}/releases/latest/download/manifest.json
          ARCHIVE="$(jq -r '.targets["aarch64-apple-darwin"].archive' /tmp/skew-manifest.json)"
          VERSION="$(jq -r '.version' /tmp/skew-manifest.json)"
          echo "skew peer: ${VERSION} (${ARCHIVE})"
          mkdir -p /tmp/skew-old
          curl -fsSL "https://github.com/${{ github.repository }}/releases/latest/download/${ARCHIVE}" \
            | tar -xz -C /tmp/skew-old
          OXIMUX_SKEW_CLI=/tmp/skew-old/oximux cargo test -p oximux-cli --test wire_skew_e2e

      - name: xtask file-size-lint
        run: cargo run -p xtask -- file-size-lint

      # The Windows icon is derived from the macOS one, so it goes stale on
      # whichever machine edits `assets/AppIcon.icns` — which is this one, not
      # the Windows runner. Checking it here is what makes "regenerate the .ico"
      # a step nobody has to remember.
      - name: xtask icon --check
        run: cargo run -p xtask -- icon --check

      # The app bundle carries its version by hand, and every release commit
      # has had to remember to bump it alongside Cargo.toml. `make-dmg.sh`
      # already refuses a bundle whose version disagrees — but it says so an
      # hour into a release build, after the whole workspace has compiled and
      # been signed. The same comparison costs nothing here, where a bump that
      # forgot the plist is still a one-line fix.
      - name: assets/Info.plist agrees with Cargo.toml
        run: |
          CARGO="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          for key in CFBundleShortVersionString CFBundleVersion; do
            got="$(/usr/libexec/PlistBuddy -c "Print :$key" assets/Info.plist)"
            if [[ "$got" != "$CARGO" ]]; then
              echo "assets/Info.plist $key is $got but Cargo.toml says $CARGO" >&2
              exit 1
            fi
          done
          echo "Info.plist and Cargo.toml agree at $CARGO"

  # Linux leg of the portability gate, added ahead of the CLI/serve work: the
  # crate set below is exactly what the `oximux` CLI and `oximux serve` reuse,
  # and "Windows-CI-proven, therefore probably Linux-clean" is an assumption
  # until a Linux runner says so. GPUI, dictation, computer-use, macos-trust,
  # auto-update, editor and ui stay out on purpose — the CLI does not link
  # them, and keeping them out is what lets this job run on a plain ubuntu
  # image with no GUI system libraries.
  linux-check:
    name: linux cli-crate gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-v1-${{ hashFiles('**/Cargo.lock') }}

      # `oximux-settings` is deliberately missing from this list: with default
      # features it links gpui, which is exactly what a headless consumer must
      # not do. It gets its own gpui-free step below.
      #
      # `oximux-cli` IS here, and belongs here: this crate set existed to prove
      # the CLI's dependencies build headless, but the binary on top of them was
      # never itself compiled for Linux — so its own code (the self-update
      # module, build.rs, the serve wiring) had no Linux gate at all until a
      # release tried to build it. Discovering that at release time means a red
      # release job; discovering it here means a red PR.
      - name: cargo check (CLI crate set)
        run: >
          cargo check --all-targets
          -p oximux-cli
          -p oximux-core
          -p oximux-pty
          -p oximux-git
          -p oximux-agent-core
          -p oximux-agents
          -p oximux-storage
          -p oximux-relay-proto
          -p oximux-relay
          -p oximux-relay-client
          -p oximux-relay-supervisor
          -p oximux-relay-terminals
          -p oximux-single-instance
          -p oximux-remote-proto
          -p oximux-remote-host
          -p oximux-remote-session
          -p oximux-remote-iroh
          -p oximux-shell-env
          -p oximux-owner-only
          -p oximux-proc-cwd
          -p oximux-job-object
          -p oximux-no-window
          -p oximux-remote-local
          -p oximux-cli

      # The step above already builds remote-iroh's accept-loop half: selected
      # via `-p`, the crate's OWN `default = ["host"]` applies (the opt-in
      # lives in the workspace dependency alias, which sets
      # `default-features = false`). What that step never builds is the
      # client-only shape — the one the mobile core consumes today and the
      # CLI's remote client will — so that is the variant checked here.
      # `--lib`, not `--all-targets`: the integration tests under tests/
      # exercise the accept loop and only compile with `host` on.
      - name: cargo check (remote-iroh client half, host off)
        run: cargo check --lib -p oximux-remote-iroh --no-default-features

      # The musl leg of the release matrix, proven HERE first: release jobs run
      # only on tags, so without this the first execution of the musl build
      # would be a release attempt — the exact never-executed-step class that
      # cost v0.1.7 five runs. A debug build is enough: linking against musl is
      # where this breaks, and debug links the same libraries.
      - name: musl build gate (release parity)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --target x86_64-unknown-linux-musl -p oximux-cli -p oximux-relay

      # The build the CLI will actually use: settings with the UI toolkit
      # absent from the dependency tree entirely.
      - name: cargo check (settings without gpui)
        run: cargo check --all-targets -p oximux-settings --no-default-features

      # Separate test steps, not one `-p a -p b --test t` invocation: cargo
      # applies `--test` across every `-p` given and silently skips a package
      # without that target, so proc-cwd's unit tests would never run.
      - name: cargo test (proc-cwd Linux arm)
        run: cargo test -p oximux-proc-cwd

      # The only end-to-end coverage of PTY spawn/attach/replay on Linux —
      # same rationale as the Windows job's step of the same name.
      - name: cargo test (relay daemon end-to-end)
        run: cargo test -p oximux-relay --test relay_integration

      # The CLI's trust factors are filesystem facts (0700 dir, 0600 socket
      # and token, readback-asserted), so the only Linux that ever checks
      # them is this runner. The CLI E2E drives the compiled binary against
      # a live dispatcher over a real socket — exit codes are the contract.
      - name: cargo test (local control socket)
        run: cargo test -p oximux-remote-local

      # Covers every suite under apps/cli/tests, including the four that boot a
      # real `serve` and spawn a real agent through a `claude` shim on PATH
      # (agent_spawn / recovery / security / serve). Those are the only tests
      # anywhere that cross a process boundary into a spawned agent, which is
      # where the confinement credential and the inherited-environment scrub
      # are the only observable.
      - name: cargo test (oximux CLI end-to-end)
        run: cargo test -p oximux-cli

      # `docs/cli-reference.md` is generated from the CLI's own clap tree, so it
      # can only be wrong by being stale. Regenerating and diffing is what makes
      # "committed" mean "current" — without this the file is a snapshot of
      # whenever someone last remembered, which is worse than no reference at
      # all, since a reader cannot tell which half to trust.
      #
      # Linux only, deliberately: the document has no platform-specific content,
      # so running it three times would only add two ways for the same check to
      # flake.
      - name: docs/cli-reference.md is not stale
        run: |
          ./scripts/gen-cli-docs.sh > /tmp/cli-reference.md
          if ! diff -u docs/cli-reference.md /tmp/cli-reference.md; then
            echo
            echo "docs/cli-reference.md no longer matches the CLI's command tree."
            echo "Regenerate it:  ./scripts/gen-cli-docs.sh > docs/cli-reference.md"
            exit 1
          fi

      # The serve binary's dependency hygiene, as a hard gate: the CLI must
      # never link the GUI toolkit or the desktop-only capability stacks. A
      # `cargo tree` scan rather than a compile failure because these leak in
      # transitively — a compile would happily succeed with gpui in tree.
      - name: cli dependency-tree gate (no gpui / dictation / computer-use)
        run: |
          cargo tree -p oximux-cli -e normal > /tmp/cli-tree.txt
          if grep -E '(^| )(gpui|gpui_platform|oximux-dictation|oximux-computer-use|oximux-ui|oximux-editor)( |$)' /tmp/cli-tree.txt; then
            echo "forbidden dependency in the oximux-cli tree (see matches above)"
            exit 1
          fi

  # The only job that measures anything at runtime. Every other job here is
  # check/test/package: they prove the code compiles and behaves, and say
  # nothing at all about what it retains — which is how a residency regression
  # ships. `scripts/mem-smoke.sh` boots a real `oximux serve`, streams real
  # agent partials at it through a fixture built for the purpose, and samples
  # the host's RSS at four checkpoints.
  #
  # Linux, and only Linux, on purpose. Not a preference — a constraint: no job
  # in this file boots a GPUI window, so the GUI half of residency (sprite
  # atlas, decoded images, the transcript's render caches) is out of reach of
  # CI entirely. What IS reachable is the engine half, which is where this
  # plan's allocations live, and `oximux serve` is exactly that half with no
  # window attached. Read a green run as "the headless surface did not
  # regress", never as "memory is fine" — the script's own header says which
  # macOS commands to reach for when a user report disagrees with this gate.
  #
  # Thresholds are deliberately loose and live in the script. They exist to
  # catch the class of regression this plan is about (retention in the tens of
  # multiples, a monotonic idle ratchet), not to police single-digit percent
  # drift on a shared runner. Tighten them from numbers this job has actually
  # produced across several runs — a flaky gate gets ignored, which is worse
  # than a loose one.
  mem-smoke:
    name: memory smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      # Shares linux-check's cache key on purpose: that job builds the same
      # crate set with the same profile, so whichever runs first warms the
      # other. A separate key would double the cache for no benefit.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-v1-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo build (oximux-cli)
        run: cargo build -p oximux-cli

      # `--check` turns the thresholds on; without it the script only reports.
      # The JSON is uploaded rather than only printed so a later phase can diff
      # its numbers against this run's without re-reading a log.
      - name: mem-smoke
        run: ./scripts/mem-smoke.sh --check --json mem-smoke.json
        env:
          OXIMUX_MEM_CLI: target/debug/oximux-cli
          # Set HERE rather than inherited from the script's defaults, and set
          # wide, because no Linux number for this workload exists yet — the
          # script's defaults come from a macOS band (8.1x-9.5x steady-state
          # retention, release profile) and glibc is not obliged to land in the
          # same place. A first run that goes red on an uncalibrated threshold
          # blocks merges and teaches everyone to ignore this job.
          #
          # These are calibration values with one job: catch the class of
          # regression this plan is about. Tighten them to the observed Linux
          # band once several runs exist, record that band in the script header
          # next to the macOS one, and then drop these overrides so the
          # defaults are the single source of truth.
          OXIMUX_MEM_MAX_RETENTION_MULTIPLE: 20
          OXIMUX_MEM_MAX_IDLE_GROWTH_KB: 32768
          OXIMUX_MEM_MAX_REOPEN_MS: 8000

      # `always()`, because the run that FAILED a threshold is the one whose
      # numbers someone needs to read.
      - name: Upload mem-smoke numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mem-smoke-${{ github.run_id }}
          path: mem-smoke.json
          if-no-files-found: warn

  # The ARM twin of linux-check's "musl build gate": aarch64-unknown-linux-musl
  # joins the release matrix, so its first execution must not be a release
  # attempt. Its own job rather than a step in linux-check because musl-gcc
  # emits the host's architecture — a native aarch64 runner is the toolchain,
  # not a preference. Debug build for the same reason as the x86_64 gate:
  # linking against musl is where this breaks, and debug links the same
  # libraries.
  linux-arm-musl-check:
    name: linux arm musl gate
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-arm-musl-cargo-v1-${{ hashFiles('**/Cargo.lock') }}

      - name: musl build gate (release parity, aarch64)
        env:
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add aarch64-unknown-linux-musl
          cargo build --target aarch64-unknown-linux-musl -p oximux-cli -p oximux-relay

  # Permanent gate for the Windows port. macOS is still the only shipping
  # target; this job stops a macOS-only API from landing on a shared path
  # unnoticed, which is exactly the class of breakage that made the port
  # expensive to start.
  #
  # Native runner rather than a cross-check from macOS on purpose: only a real
  # windows-msvc host surfaces link/manifest problems, and the C-dependency
  # build scripts (rusqlite's bundled sqlite, ring) need a real MSVC toolchain.
  # Locally, `cargo check --target x86_64-pc-windows-gnu` with mingw-w64 is a
  # fast proxy — `cfg(windows)` resolves identically — but `target_env` does
  # not, so this job is the authority.
  #
  # It also RUNS a narrow set of tests. That matters more than it sounds: the
  # port is being written on a machine with no Windows, so this runner is the
  # only thing that executes any of it. The DACL assertions and the job-object
  # tree kill are not checkable anywhere else — a green compile says nothing
  # about whether a job object actually reaps a grandchild.
  windows-check:
    name: windows compile gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The Windows bootstrap installer is PowerShell, so this is the only job
      # that can tell whether it even parses — and it is the one script no
      # developer on macOS or Linux can run before shipping it. A parse error
      # here would first surface to a user running the published one-liner.
      #
      # Parse-only: the script downloads a release and writes to PATH, so
      # executing it is not something CI should do.
      - name: Parse-check the Windows installer
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install-cli.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "$($_.Extent.StartLineNumber): $($_.Message)" }
            throw "scripts/install-cli.ps1 has $($errors.Count) parse error(s)"
          }
          Write-Host 'scripts/install-cli.ps1 parses'

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add x86_64-pc-windows-msvc

      # Same one-entry rule as the macOS job, and for the same reason — this
      # job was left out of that fix and hit it: `cargs.lib` (a sherpa-onnx
      # prebuilt) went missing on a restored cache and the desktop suite died
      # at link time with `LNK1181: cannot open input file`, which reads as a
      # broken dependency rather than as a download that never happened.
      # sherpa-rs-sys puts the Windows libraries under %LOCALAPPDATA%, outside
      # `target`, and bakes that path into its build-script output; caching
      # `target` alone restores the fingerprint without the files it names.
      #
      # Key bumped to v2 so entries saved under the old layout cannot satisfy
      # the new one.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/AppData/Local/sherpa-rs
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}

      # The macOS counterpart of this step, transposed: any cache that comes
      # back with the build-script output but without the libraries would link
      # against a path that is not there, so drop the output and let cargo
      # re-run the build script that downloads them.
      #
      # Must never be the step that fails the build — every lookup tolerates a
      # missing directory and the step exits 0 regardless.
      - name: Ensure the dictation libraries are present
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $prebuilts = Join-Path $env:LOCALAPPDATA 'sherpa-rs'
          $lib = Get-ChildItem -Path $prebuilts -Recurse -Filter 'cargs.lib' `
              -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($lib) {
            Write-Host "sherpa-onnx prebuilts present: $($lib.FullName)"
          } else {
            Write-Host "sherpa-onnx prebuilts absent - forcing sherpa-rs-sys to re-run"
            Get-ChildItem -Path target -Recurse -Directory -Filter 'sherpa-rs-sys-*' `
                -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }
          exit 0

      # `macos-trust` is macOS-shaped by construction: it wraps codesign and
      # spctl. Note what the exclusion does and does not buy. Its library is
      # already in the Windows graph — `oximux-auto-update` depends on it
      # unconditionally — and compiles there, so this only skips its own tests,
      # 6 of which fail on Windows because their fixtures are POSIX-shaped
      # (`/bin/sleep`, `ditto`, statvfs) rather than because the code under test
      # is macOS-only. That is a gap parked deliberately, not a settled
      # decision: the same fixture problem in `computer-use` was fixed rather
      # than excluded (`crates/computer-use/src/fixtures.rs`).
      #
      # `computer-use` used to sit beside it and no longer does. The desktop app
      # depends on it under `cfg(windows)` for the **policing hook** — not for
      # screen control, which stays off — so it was already being compiled here
      # as a dependency. Excluding it only skipped its own tests, which is the
      # worse half: the crate now carries a Windows blocklist, a Windows GUI
      # scripting brake and Windows command-line quoting, none of which a
      # dependency build exercises.
      - name: cargo check
        run: >
          cargo check --workspace --all-targets --target x86_64-pc-windows-msvc
          --exclude oximux-macos-trust

      # Blocking, and deliberately narrow. These five crates are where the
      # Windows-specific behavior lives and where a failure is unambiguous:
      # owner-only asserts the DACL reads back protected and single-owner,
      # job-object asserts a killed job takes a detached grandchild with it,
      # shell-env asserts the resolved shell is a program that exists (which is
      # what proves the pwsh probe works at all), pty's unit tests carry the
      # OSC 7 drive-letter handling, and settings covers the screen-control
      # opt-in's path matching — where "absolute" and "the same directory under
      # another name" both mean something different than they do on Unix.
      # remote-local earns its place now that preparing the runtime directory
      # stamps an inheritable DACL there instead of being a Unix-only chmod: the
      # workspace check compiles that arm, and only this step runs it.
      #
      # Kept as separate steps rather than one combined invocation: cargo
      # applies `--lib`/`--test` across every `-p` given and silently skips a
      # package that has no such target, so a typo'd target name would run
      # nothing and still report success. One command per step fails loudly.
      - name: cargo test (windows-specific crates)
        run: >
          cargo test --lib --target x86_64-pc-windows-msvc
          -p oximux-owner-only
          -p oximux-job-object
          -p oximux-shell-env
          -p oximux-pty
          -p oximux-settings
          -p oximux-remote-local

      # The desktop crate's unit suite passes in full on Windows as of the
      # single-instance fix and the fixture ports alongside it, so it graduates
      # from the informational sweep to a gate. Named separately from the list
      # above because it is not "Windows-specific behavior" — it is 1400+ tests
      # that merely now hold on Windows, and keeping it its own step means a
      # failure here reads as a regression rather than as a platform quirk.
      #
      # It earns the slot: one of those 17 failures was a real bug (the
      # single-instance lock could not read its own holder PID under mandatory
      # locking), and it sat undetected because nothing blocking ran this.
      - name: cargo test (desktop app unit suite)
        run: cargo test --lib --target x86_64-pc-windows-msvc -p oximux-app

      # Screen control is off on Windows and the driver is never declared, but
      # the crate is compiled and half-used: the PreToolUse hook ships, and with
      # it the executable blocklist, the GUI-scripting brake and the
      # `CommandLineToArgvW` quoting the hook's own command line depends on.
      #
      # All-targets rather than `--lib`, for the reason the pty steps below
      # spell out — the installer suites live under `tests/` and the workspace
      # sweep is `--lib`, so nothing else would reach them.
      #
      # Two `live_driver` tests self-ignore without a real driver binary. That
      # is correct here and would be a hole on macOS; the Windows job has no
      # driver to point them at because there is not yet a Windows driver worth
      # trusting. See `plans/260801-0157-windows-computer-use/findings.md`.
      - name: cargo test (computer-use, hook half)
        run: cargo test --target x86_64-pc-windows-msvc -p oximux-computer-use

      # The only end-to-end coverage of the piece carrying the most
      # Windows-specific machinery. Between them these boot the daemon over a
      # real named pipe, run the v8 mutual handshake from both ends, and
      # exercise spawn/attach/detach/replay/checkpoint — none of which a
      # compile check says anything about.
      - name: cargo test (relay daemon end-to-end)
        run: cargo test --target x86_64-pc-windows-msvc -p oximux-relay --test relay_integration

      - name: cargo test (relay client end-to-end)
        run: >
          cargo test --target x86_64-pc-windows-msvc
          -p oximux-relay-client --test relay_client_integration

      # These three were ported to Windows at the same time as the two suites
      # above, and need naming here for the same reason those do: nothing else
      # reaches them. The pty step is `--lib`, which skips integration targets
      # under tests/, and the informational sweep below is `--lib` too. A suite
      # ported for a platform that never runs it is worse than one left
      # unported — it compiles green and rots without anyone noticing.
      - name: cargo test (pty backend smoke)
        run: cargo test --target x86_64-pc-windows-msvc -p oximux-pty --test backend_smoke

      - name: cargo test (pty snapshot smoke)
        run: cargo test --target x86_64-pc-windows-msvc -p oximux-pty --test snapshot_smoke

      - name: cargo test (relay checkpoint lifecycle)
        run: cargo test --target x86_64-pc-windows-msvc -p oximux-relay --test checkpoint_lifecycle

      # Windows is a full-parity CLI target, and the named pipe carries an
      # explicit owner-only DACL instead of directory permissions — a claim
      # only a real windows-msvc host can verify. The `--lib` sweep below
      # reaches the unit tests; these two reach the integration suites under
      # tests/, which it cannot.
      - name: cargo test (local control socket)
        run: cargo test --target x86_64-pc-windows-msvc -p oximux-remote-local

      - name: cargo test (oximux CLI end-to-end)
        run: cargo test --target x86_64-pc-windows-msvc -p oximux-cli

      # Blocking as of the port of the last macOS-shaped fixtures: this was the
      # informational sweep, kept non-blocking to produce the list of what
      # actually failed on Windows, with instructions to flip it once that list
      # was empty. It is empty — every crate here passes on a real windows-msvc
      # host — so it is now the gate, and the enumerated steps above are kept
      # only because a named failure is faster to read than one buried in a
      # workspace run.
      #
      # It found real bugs on the way, which is the argument for it being
      # blocking rather than advisory: the single-instance lock could not read
      # its own holder PID under Windows' mandatory file locking, and the
      # checkpoint engine failed to recognise one git version's phrasing for a
      # pruned object. Both were invisible while nothing here could fail.
      #
      # One residual fragility worth knowing when this goes red: git's stderr
      # wording is what `is_missing_object` matches on, so a runner with a git
      # whose phrasing is not yet in that list fails `pruned_object_reports_missing`.
      # The fix is to add the phrase, not to loosen the matcher.
      - name: cargo test (full unit suite)
        run: >
          cargo test --workspace --lib --target x86_64-pc-windows-msvc
          --exclude oximux-macos-trust
