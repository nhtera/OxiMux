name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check + clippy + test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # No `cargo fmt --check` step on purpose. This repo has no rustfmt.toml and
      # is not kept rustfmt-clean — it uses a hand-maintained style that diverges
      # from stable rustfmt defaults, so the check could never pass (it wants to
      # rewrite 417 files). A gate that is always red is not a gate; match the
      # surrounding code by hand instead.

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: xtask file-size-lint
        run: cargo run -p xtask -- file-size-lint
