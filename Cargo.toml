[workspace]
resolver = "2"
members = [
    "apps/cli",
    "apps/desktop",
    "crates/ui",
    "crates/core",
    "crates/owner-only",
    "crates/job-object",
    "crates/no-window",
    "crates/shell-env",
    "crates/dictation",
    "crates/pty",
    "crates/git",
    "crates/agent-core",
    "crates/agents",
    "crates/computer-use",
    "crates/macos-trust",
    "crates/auto-update",
    "crates/editor",
    "crates/markdown",
    "crates/syntax",
    "crates/storage",
    "crates/settings",
    "crates/relay-proto",
    "crates/relay",
    "crates/relay-client",
    "crates/relay-supervisor",
    "crates/relay-terminals",
    "crates/single-instance",
    "crates/remote-proto",
    "crates/remote-host",
    "crates/remote-session",
    "crates/remote-iroh",
    "crates/remote-local",
    "crates/mobile-core",
    "crates/proc-cwd",
    "crates/proc-ports",
    "crates/proc-tree",
    "crates/worktree-ops",
    "xtask",
]

[workspace.package]
edition = "2024"
version = "0.1.17"
authors = ["nhtera"]
license = "Apache-2.0"
publish = false
rust-version = "1.89"

[workspace.dependencies]
# Internal crates
oximux-app      = { path = "apps/desktop" }
oximux-cli      = { path = "apps/cli" }
oximux-ui       = { path = "crates/ui" }
oximux-core     = { path = "crates/core" }
# Owner-only access for the secrets we write to disk. Its own crate because the
# desktop app, the relay daemon and the remote host share no other dependency.
oximux-markdown  = { path = "crates/markdown" }
oximux-syntax    = { path = "crates/syntax" }
oximux-owner-only = { path = "crates/owner-only" }
# Windows tree-kill for agent CLIs and terminal PTYs. Its own crate for the same
# reason as owner-only: the relay and the agents crate share no dependency.
oximux-job-object = { path = "crates/job-object" }
# CREATE_NO_WINDOW on every spawned child, so a console-subsystem `git`/`node`/
# `rg` doesn't pop an empty terminal window out of the GUI-subsystem app. Its
# own crate for the usual reason: the spawn sites span crates that share no
# other dependency.
oximux-no-window = { path = "crates/no-window" }
# Which shell a terminal runs, and the locale it needs. Same sharing problem
# again, and here the duplication was already real: both consumers carried a
# byte-identical copy of the locale fix.
oximux-shell-env = { path = "crates/shell-env" }
oximux-dictation = { path = "crates/dictation" }
oximux-pty      = { path = "crates/pty" }
oximux-git      = { path = "crates/git" }
oximux-agent-core = { path = "crates/agent-core" }
oximux-agents   = { path = "crates/agents" }
oximux-computer-use = { path = "crates/computer-use" }
oximux-macos-trust = { path = "crates/macos-trust" }
oximux-auto-update = { path = "crates/auto-update" }
oximux-editor   = { path = "crates/editor" }
oximux-storage  = { path = "crates/storage" }
# `gpui` is opt-in rather than default so a headless consumer cannot inherit the
# UI toolkit by omission — `oximux-worktree-ops` sits on the path from
# `oximux-cli` to here and needs only `project_scripts`. Consumers with `Global`
# impls, theme tokens or typography ask for it with `features = ["gpui"]`.
oximux-settings = { path = "crates/settings", default-features = false }
oximux-relay-proto = { path = "crates/relay-proto" }
oximux-relay    = { path = "crates/relay" }
oximux-relay-client = { path = "crates/relay-client" }
# Spawns/adopts the relay daemon and hands back a connected client. Its own
# crate because BOTH hosts need it — the desktop app and `oximux serve` — and
# apps/desktop has no [lib] target for the CLI to depend on.
oximux-relay-supervisor = { path = "crates/relay-supervisor" }
# remote-host's TerminalSource over the relay daemon — shared by the desktop
# and `oximux serve` for the same reason the supervisor is.
oximux-relay-terminals = { path = "crates/relay-terminals" }
# The advisory data-dir role lock (GUI instance, schedule ticker) — its own
# crate because both hosts contend for the same roles.
oximux-single-instance = { path = "crates/single-instance" }
oximux-remote-proto = { path = "crates/remote-proto" }
oximux-remote-host = { path = "crates/remote-host" }
oximux-worktree-ops = { path = "crates/worktree-ops" }
oximux-remote-session = { path = "crates/remote-session" }
# `host` is opt-in rather than default so the mobile core cannot inherit the
# desktop accept loop (and, through it, the PTY stack) by omission. Desktop
# consumers ask for it explicitly with `features = ["host"]`.
oximux-remote-iroh = { path = "crates/remote-iroh", default-features = false }
oximux-mobile-core = { path = "crates/mobile-core" }
oximux-remote-local = { path = "crates/remote-local" }
oximux-proc-cwd = { path = "crates/proc-cwd" }
# Which program a terminal is actually running, by walking its shell's
# descendants. Its own crate for the same reason proc-cwd is: dependency-light
# kernel introspection whose consumers share nothing else.
oximux-proc-tree = { path = "crates/proc-tree" }
# Which local ports a set of processes is listening on. Scoped to a caller's
# pid set rather than the whole machine — see the crate doc for why that is a
# correctness decision on Linux and not just a courtesy.
oximux-proc-ports = { path = "crates/proc-ports" }

# GPUI — see docs/gpui-pins.md. We deliberately do NOT pin `rev` here. The
# upstream `longbridge/gpui-component` workspace pins `gpui` to the default
# branch with no rev; if we pin a rev here, cargo treats them as separate
# sources and produces two copies of `gpui::App` in the dep graph (one of
# v0.9's exact failure modes). The canonical pin lives in `Cargo.lock` —
# bump via `cargo update -p gpui -p gpui_platform -p gpui_macros` and log
# the resulting commit in `docs/gpui-pins.md`.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui_macros = { git = "https://github.com/zed-industries/zed" }
# Enable a broad set of tree-sitter grammars so the code editor can syntax-
# highlight the language families a typical workspace contains. The
# `tree-sitter-languages` meta-feature pulls in every grammar shipped by
# `gpui-component` (rust, ts, js, python, go, c, cpp, java, kotlin, swift,
# php, ruby, lua, zig, scala, sql, css, html, json, markdown, yaml, toml,
# bash, make, cmake, proto, graphql, diff, ...). Build time is a few extra
# seconds; the runtime cost is per-file (lazy parser construction).
# Sourced from our fork's `oximux/link-click-ccc1e76` branch: upstream rev
# ccc1e76 plus one backported commit (upstream #2621) adding
# `TextView::on_link_click`, which the markdown preview needs to open
# relative document links in-app. Drop the fork and return to upstream the
# next time the pin is bumped past upstream 3cb3cc13 (the API is identical).
gpui-component = { git = "https://github.com/nhtera/gpui-component", rev = "8adf9846c26f354333ab5bdafb18bf2dc3328db4", features = ["tree-sitter-languages"] }
gpui-component-assets = { git = "https://github.com/nhtera/gpui-component", rev = "8adf9846c26f354333ab5bdafb18bf2dc3328db4" }

# Async + util
tokio = { version = "1", features = ["full"] }
# GUI<->relay local transport: unix-domain sockets on unix, named pipes on
# Windows, behind one tokio type. Two properties this pin is relied on for,
# both verified against 2.4.2's source: a security descriptor set on
# `ListenerOptions` reaches `CreateNamedPipeW` through the *tokio* constructor
# (not only the sync one), and the unix stream splits via `into_split` rather
# than a `BiLock` — this socket carries every keystroke and every byte of PTY
# output, so a lock between the halves would sit on the hottest path in the app.
interprocess = { version = "2.4", features = ["tokio"] }
futures = "0.3"
anyhow = "1"
# Headless Mermaid (parse + layout + SVG), no browser/Node. Pinned exact: 0.x
# with real API churn between minors, and 0.7+ raises MSRV past our 1.89.
# `render` = SVG output; the `raster` feature stays off — gpui rasterizes SVG
# itself via usvg/resvg.
merman = { version = "=0.6.2", default-features = false, features = ["render"] }
# Strips the `\\?\` verbatim prefix that `Path::canonicalize` adds on Windows,
# where it is safe to drop. Canonicalized paths get stored in settings files and
# compared against user-typed ones, and the prefix is correct-but-unspellable in
# both roles. Already in the graph transitively; declared so the direct use is
# visible. No-op on other platforms.
dunce = "1"
async-trait = "0.1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `oximux run --output-schema`: hold an agent's final answer to a JSON Schema.
# `default-features = false` drops the bundled HTTP resolver (and reqwest with
# it) — a CLI validating a schema the operator handed it must never fetch a
# remote `$ref`, which would turn a validation run into a network call against
# a URL the schema author chose.
jsonschema = { version = "0.35", default-features = false }
# Phase 5 relay wire format. v2 has the cleaner config API but its
# byte layout is not ABI-stable across point releases — the workspace
# pin is the authoritative version both app + daemon agree on.
bincode = { version = "2", features = ["serde"] }
# Remote-control wire codec (crates/remote-proto). Non-self-describing +
# compact; the RPC envelope is postcard, append-only by ordinal (mirrors the
# relay-proto PROTOCOL_VERSION discipline). Event/decision payloads that carry
# `serde_json::Value` ride as a serde_json string INSIDE the envelope — postcard
# cannot deserialize `Value` (it's non-self-describing; `deserialize_any` is
# unsupported), and JSON is already those types' persisted representation.
postcard = "1"
# Remote-control P2P transport (crates/remote-iroh): iroh 1.0 (QUIC + hole-punch
# + n0 relay/pkarr discovery) is the production `Transport`/`Connector` impl
# beneath the pure-Rust remote-session client. The `Node*`→`Endpoint*` API rename
# landed in 1.0 — write concrete calls against the 1.0 surface, not the 0.96
# vendored reference.
iroh = "1"
# Mobile FFI (crates/mobile-core): uniffi 0.31 wraps remote-session + iroh into a
# Swift/Kotlin/JSI surface for the React Native app. 0.31 is the version
# uniffi-bindgen-react-native and n0's iroh-ffi both track.
uniffi = { version = "0.31", features = ["cli", "tokio"] }
# Remote-control host auth (crates/remote-host). Separate app-signing Ed25519
# identity + a QR HMAC-SHA256 pairing proof, decoupled from the iroh transport
# key. `rand` (OsRng) mints host keys, challenge nonces, and session tokens.
ed25519-dalek = "2"
hmac = "0.12"
rand = "0.8"
# Phase 5 relay daemon: lock-free concurrent map for PtyRegistry. Used
# only by the relay binary; declared centrally for future reuse.
dashmap = "5"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
# Daily-rotated relay daemon log (phase-07 hardening). Stays detached from
# tracing-subscriber's own rotation API to keep the dep surface minimal.
tracing-appender = "0.2"
# macOS unified-logging mirror for the relay (visible in Console.app).
tracing-oslog = "0.3"

# Phase 1-2 prep (declared centrally; pulled into crates as used)
portable-pty = "0.8"
alacritty_terminal = "0.25"
# Regex engine for the scrollback search's `.*` toggle. `unicode` features
# left off — terminal content is ASCII-dominant and the smaller binary +
# faster compile matter more than full Unicode property classes here.
regex = { version = "1", default-features = false, features = ["std", "perf"] }

# Phase 4 prep
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Agent-chat image attachments: base64 for the wire/persist encoding; `image`
# to transcode clipboard/file formats Claude doesn't accept (tiff/bmp/…) to PNG.
base64 = "0.22"
image = "0.25"
# QR encoding for the remote-control pairing code. `default-features = false`
# keeps it to the pure-Rust bitmap encoder — no `image`/`svg` renderers, so it
# can't drag in a second, conflicting `image` version.
qrcode = { version = "0.14", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Phase 5 editor + LSP. Pinned to match gpui-component's transitive
# `lsp-types = "0.97"` so the `HoverProvider` trait surface (Hover,
# Diagnostic, Position) is a single concrete type across the dep graph.
# Two copies of `lsp_types` would force a conversion shim at every
# provider boundary — see docs/gpui-pins.md for the same family of
# trap the gpui crates are pinned against.
lsp-types = { version = "0.97", features = ["proposed"] }
# `url::Url::from_file_path` is the percent-encoding gate between
# `Path` and the `file://` URI rust-analyzer expects. Used by the
# editor crate's `path_to_file_uri`; paths with spaces / unicode /
# reserved chars round-trip cleanly only with proper encoding.
url = "2"
# macOS Application Support directory resolution (see apps/desktop/src/main.rs).
# default-features off: we only need `data_dir()` on macOS; the default
# features pull in Windows/X11 helpers we never call.
dirs = { version = "5", default-features = false }
# CLI arg parsing — derive is the single source of truth for parse/help/
# completions and the `agent-context` schema dump.
clap = { version = "4", features = ["derive"] }
# `oximux completions <shell>`. Generated from the same derive tree as `--help`
# and `agent-context`, so a 29-verb surface cannot grow a command the
# completions do not know about.
clap_complete = "4"
# Raw-mode terminal control for the CLI's `term attach` (and only that): raw
# stdin, size probes, cross-platform including the Windows console. The CLI
# renders everything else with plain prints — no TUI framework rides in here.
crossterm = "0.28"
# Native folder picker — wraps NSOpenPanel on macOS via objc2. We use
# `AsyncFileDialog` from the GPUI `cx.spawn` task so the OxiMux window
# stays responsive while the panel is open. default-features off:
# we don't need the GTK/XDG portal stacks the default features pull in
# (Linux is not a v1 target).
rfd = { version = "0.14", default-features = false }

# Voice dictation (crates/dictation). `sherpa-rs` = sherpa-onnx Rust bindings
# (offline Whisper for Vietnamese + Parakeet transducer for English). Default
# features drop `tts` (we only transcribe) and keep `download-binaries` so the
# build fetches a prebuilt onnxruntime instead of compiling it from source.
# NOTE: the spike confirmed onnxruntime links as a *dynamic* dylib
# (target/<profile>/deps/libonnxruntime.*.dylib) — the bundled `.app` must copy
# it in + set rpath. The `static` feature is the alternative if that proves
# painful. `cpal` = CoreAudio capture; `hound` = wav I/O for fixtures/tests;
# `ureq` = model download (matches sherpa-rs's own transitive http client, no
# graph dup); `sha2` = archive verification.
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries"] }
cpal = "0.18"
hound = "3.5"
ureq = "2.12"
sha2 = "0.10"

# CLI self-update. `minisign-verify` is the independent trust root: a
# zero-dependency verifier for the maintainer signature over a release
# manifest, checked before any checksum *inside* that manifest is believed —
# the manifest and the artifacts it describes ship from the same GitHub
# Release, so a checksum alone falls to whoever can publish one.
# `flate2`/`tar` unpack the release archive in-process rather than shelling
# out, which is what makes the extraction path testable against hostile
# archives. `blake2` is dev-only: minisign prehashes with Blake2b-512, so
# minting real signatures in tests needs it (the verifier does not).
minisign-verify = "0.2"
flate2 = "1"
tar = "0.4"
# Speech-model archives are `.tar.bz2`. Decoded in-process rather than via the
# system `tar`: Windows' bundled bsdtar is built without bzip2 (libarchive with
# zlib only), so `tar -xjf` there falls back to an external `bzip2` filter that
# does not exist and hangs forever. 0.6 uses the pure-Rust `libbz2-rs-sys`
# backend, so this adds no C toolchain requirement.
bzip2 = "0.6"
blake2 = "0.10"
# The Windows driver archive is a `.zip`, unpacked in-process for the same
# reason the tarballs above are: an extraction path that can be tested against
# a hostile archive. `deflate-flate2` only — reading needs a decompressor, and
# the default feature set drags in five compressors plus AES this never uses.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

# Phase 5 step 3 — file tree backend. `ignore` is the gitignore-aware
# walker ripgrep uses; `WalkBuilder::max_depth(Some(1))` gives lazy
# single-level enumeration. `notify-debouncer-full` drives FSEvents on
# macOS with a 200ms debounce.
ignore = "0.4"
# Re-exports its bundled `notify` at `notify_debouncer_full::notify::*`
# — depend on the debouncer and use the re-export to avoid two copies
# of `notify` in the graph (a single direct `notify = "8"` next to
# debouncer-full's pinned notify-7 silently produced trait-mismatch
# compile errors). `DebounceEventHandler` has a blanket impl for any
# `FnMut(DebounceEventResult) + Send + 'static`, so the watcher passes
# a sync closure that forwards into a tokio mpsc (see watcher.rs) — no
# special debouncer feature flag needed.
notify-debouncer-full = "0.4"
# Temp dirs for file-tree backend unit tests (dev-dep on the editor crate).
tempfile = "3"
# PATH resolution for "is this agent CLI installed?" and for turning a bare
# name into an absolute path. Replaces four hand-rolled versions — two that
# shelled out to the `which` binary and two that walked PATH themselves. The
# crate is pure Rust (no spawn), and it is what knows about Windows `PATHEXT`,
# so `claude` resolves to the `claude.cmd` shim npm installs. Already in the
# graph transitively at this version; declaring it adds no new compilation.
which = "6"
# Phase 10 — word-level diff inside the diff viewer. `similar` produces
# `TextDiff::from_words` op streams that drive per-token coloring inside
# modified-modified line pairs. Pure Rust, no `unicode-bidi` transitive
# (the `bytes` feature is the default and keeps the dep slim).
similar = "2.6"
# Phase 10.1 — syntax highlighting inside the diff body. `default-fancy`
# selects the pure-Rust `fancy-regex` engine instead of `onig` (the C
# Oniguruma binding) — avoids a `.a` link on macOS, smaller bundle, no
# extra build deps. Bundled syntaxes cover Rust/TS/Markdown/TOML/JSON
# out of the box. Loaded lazily via `LazyLock` so workspace open isn't
# blocked on the ~30 ms first-call set-load.
# Block-level markdown parsing for the chat transcript. `into_offset_iter` is
# the reason for this crate specifically: it reports a byte range per event, and
# without those ranges an incremental reparse has nothing to anchor on.
#
# Pinned to a minor version on purpose. Range reporting and GFM specifics drift
# between releases, and `crates/markdown/tests/parity.rs` is the only thing in
# the tree that would catch it — so a bump is a change that must re-run that
# corpus, not a routine dependency refresh.
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
# The grammar collection syntect parses with, hoisted to the workspace so the
# desktop and `oximux-syntax` cannot end up on different sets — two grammar
# collections in one binary would be the same duplication this work exists to
# remove, just one level down.
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }

[profile.dev]
opt-level = 0
debug = 1

# Syntax highlighting runs syntect on a `fancy-regex` (pure-Rust) backend.
# Unoptimized, its regex engine is ~10 ms per source line — a debug-build
# diff of a few hundred lines stalls the UI for ~1 s while it highlights.
# Compile just these hot crates optimized even in dev builds so highlighting
# runs at release speed; the app itself stays opt-level 0 (debuggable, fast
# incremental rebuilds). These crates rarely change, so the one-time
# optimized compile stays cached.
[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.test]
opt-level = 1