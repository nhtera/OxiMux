[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/ui",
    "crates/core",
    "crates/dictation",
    "crates/pty",
    "crates/git",
    "crates/agent-core",
    "crates/agents",
    "crates/editor",
    "crates/storage",
    "crates/settings",
    "crates/relay-proto",
    "crates/relay",
    "crates/relay-client",
    "crates/remote-proto",
    "crates/remote-host",
    "crates/remote-session",
    "crates/remote-iroh",
    "crates/mobile-core",
    "crates/proc-cwd",
    "xtask",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["nhtera"]
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.89"

[workspace.dependencies]
# Internal crates
oximux-app      = { path = "crates/app" }
oximux-ui       = { path = "crates/ui" }
oximux-core     = { path = "crates/core" }
oximux-dictation = { path = "crates/dictation" }
oximux-pty      = { path = "crates/pty" }
oximux-git      = { path = "crates/git" }
oximux-agent-core = { path = "crates/agent-core" }
oximux-agents   = { path = "crates/agents" }
oximux-editor   = { path = "crates/editor" }
oximux-storage  = { path = "crates/storage" }
oximux-settings = { path = "crates/settings" }
oximux-relay-proto = { path = "crates/relay-proto" }
oximux-relay    = { path = "crates/relay" }
oximux-relay-client = { path = "crates/relay-client" }
oximux-remote-proto = { path = "crates/remote-proto" }
oximux-remote-host = { path = "crates/remote-host" }
oximux-remote-session = { path = "crates/remote-session" }
# `host` is opt-in rather than default so the mobile core cannot inherit the
# desktop accept loop (and, through it, the PTY stack) by omission. Desktop
# consumers ask for it explicitly with `features = ["host"]`.
oximux-remote-iroh = { path = "crates/remote-iroh", default-features = false }
oximux-mobile-core = { path = "crates/mobile-core" }
oximux-proc-cwd = { path = "crates/proc-cwd" }

# GPUI — see docs/gpui-pins.md. We deliberately do NOT pin `rev` here. The
# upstream `longbridge/gpui-component` workspace pins `gpui` to the default
# branch with no rev; if we pin a rev here, cargo treats them as separate
# sources and produces two copies of `gpui::App` in the dep graph (one of
# v0.9's exact failure modes). The canonical pin lives in `Cargo.lock` —
# bump via `cargo update -p gpui -p gpui_platform -p gpui_macros` and log
# the resulting commit in `docs/gpui-pins.md`.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui_macros = { git = "https://github.com/zed-industries/zed" }
# Enable a broad set of tree-sitter grammars so the code editor can syntax-
# highlight the language families a typical workspace contains. The
# `tree-sitter-languages` meta-feature pulls in every grammar shipped by
# `gpui-component` (rust, ts, js, python, go, c, cpp, java, kotlin, swift,
# php, ruby, lua, zig, scala, sql, css, html, json, markdown, yaml, toml,
# bash, make, cmake, proto, graphql, diff, ...). Build time is a few extra
# seconds; the runtime cost is per-file (lazy parser construction).
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "ccc1e7689203d09bfc88a0aae29473d1c289fa0c", features = ["tree-sitter-languages"] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "ccc1e7689203d09bfc88a0aae29473d1c289fa0c" }

# Async + util
tokio = { version = "1", features = ["full"] }
futures = "0.3"
anyhow = "1"
async-trait = "0.1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Phase 5 relay wire format. v2 has the cleaner config API but its
# byte layout is not ABI-stable across point releases — the workspace
# pin is the authoritative version both app + daemon agree on.
bincode = { version = "2", features = ["serde"] }
# Remote-control wire codec (crates/remote-proto). Non-self-describing +
# compact; the RPC envelope is postcard, append-only by ordinal (mirrors the
# relay-proto PROTOCOL_VERSION discipline). Event/decision payloads that carry
# `serde_json::Value` ride as a serde_json string INSIDE the envelope — postcard
# cannot deserialize `Value` (it's non-self-describing; `deserialize_any` is
# unsupported), and JSON is already those types' persisted representation.
postcard = "1"
# Remote-control P2P transport (crates/remote-iroh): iroh 1.0 (QUIC + hole-punch
# + n0 relay/pkarr discovery) is the production `Transport`/`Connector` impl
# beneath the pure-Rust remote-session client. The `Node*`→`Endpoint*` API rename
# landed in 1.0 — write concrete calls against the 1.0 surface, not the 0.96
# vendored reference.
iroh = "1"
# Mobile FFI (crates/mobile-core): uniffi 0.31 wraps remote-session + iroh into a
# Swift/Kotlin/JSI surface for the React Native app. 0.31 is the version
# uniffi-bindgen-react-native and n0's iroh-ffi both track.
uniffi = { version = "0.31", features = ["cli", "tokio"] }
# Remote-control host auth (crates/remote-host). Separate app-signing Ed25519
# identity + a QR HMAC-SHA256 pairing proof, decoupled from the iroh transport
# key. `rand` (OsRng) mints host keys, challenge nonces, and session tokens.
ed25519-dalek = "2"
hmac = "0.12"
rand = "0.8"
# Phase 5 relay daemon: lock-free concurrent map for PtyRegistry. Used
# only by the relay binary; declared centrally for future reuse.
dashmap = "5"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
# Daily-rotated relay daemon log (phase-07 hardening). Stays detached from
# tracing-subscriber's own rotation API to keep the dep surface minimal.
tracing-appender = "0.2"
# macOS unified-logging mirror for the relay (visible in Console.app).
tracing-oslog = "0.3"

# Phase 1-2 prep (declared centrally; pulled into crates as used)
portable-pty = "0.8"
alacritty_terminal = "0.25"
# Regex engine for the scrollback search's `.*` toggle. `unicode` features
# left off — terminal content is ASCII-dominant and the smaller binary +
# faster compile matter more than full Unicode property classes here.
regex = { version = "1", default-features = false, features = ["std", "perf"] }

# Phase 4 prep
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Agent-chat image attachments: base64 for the wire/persist encoding; `image`
# to transcode clipboard/file formats Claude doesn't accept (tiff/bmp/…) to PNG.
base64 = "0.22"
image = "0.25"
# QR encoding for the remote-control pairing code. `default-features = false`
# keeps it to the pure-Rust bitmap encoder — no `image`/`svg` renderers, so it
# can't drag in a second, conflicting `image` version.
qrcode = { version = "0.14", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Phase 5 editor + LSP. Pinned to match gpui-component's transitive
# `lsp-types = "0.97"` so the `HoverProvider` trait surface (Hover,
# Diagnostic, Position) is a single concrete type across the dep graph.
# Two copies of `lsp_types` would force a conversion shim at every
# provider boundary — see docs/gpui-pins.md for the same family of
# trap the gpui crates are pinned against.
lsp-types = { version = "0.97", features = ["proposed"] }
# `url::Url::from_file_path` is the percent-encoding gate between
# `Path` and the `file://` URI rust-analyzer expects. Used by the
# editor crate's `path_to_file_uri`; paths with spaces / unicode /
# reserved chars round-trip cleanly only with proper encoding.
url = "2"
# macOS Application Support directory resolution (see crates/app/src/main.rs).
# default-features off: we only need `data_dir()` on macOS; the default
# features pull in Windows/X11 helpers we never call.
dirs = { version = "5", default-features = false }
# Native folder picker — wraps NSOpenPanel on macOS via objc2. We use
# `AsyncFileDialog` from the GPUI `cx.spawn` task so the OxiMux window
# stays responsive while the panel is open. default-features off:
# we don't need the GTK/XDG portal stacks the default features pull in
# (Linux is not a v1 target).
rfd = { version = "0.14", default-features = false }

# Voice dictation (crates/dictation). `sherpa-rs` = sherpa-onnx Rust bindings
# (offline Whisper for Vietnamese + Parakeet transducer for English). Default
# features drop `tts` (we only transcribe) and keep `download-binaries` so the
# build fetches a prebuilt onnxruntime instead of compiling it from source.
# NOTE: the spike confirmed onnxruntime links as a *dynamic* dylib
# (target/<profile>/deps/libonnxruntime.*.dylib) — the bundled `.app` must copy
# it in + set rpath. The `static` feature is the alternative if that proves
# painful. `cpal` = CoreAudio capture; `hound` = wav I/O for fixtures/tests;
# `ureq` = model download (matches sherpa-rs's own transitive http client, no
# graph dup); `sha2` = archive verification.
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries"] }
cpal = "0.18"
hound = "3.5"
ureq = "2.12"
sha2 = "0.10"

# Phase 5 step 3 — file tree backend. `ignore` is the gitignore-aware
# walker ripgrep uses; `WalkBuilder::max_depth(Some(1))` gives lazy
# single-level enumeration. `notify-debouncer-full` drives FSEvents on
# macOS with a 200ms debounce.
ignore = "0.4"
# Re-exports its bundled `notify` at `notify_debouncer_full::notify::*`
# — depend on the debouncer and use the re-export to avoid two copies
# of `notify` in the graph (a single direct `notify = "8"` next to
# debouncer-full's pinned notify-7 silently produced trait-mismatch
# compile errors). `DebounceEventHandler` has a blanket impl for any
# `FnMut(DebounceEventResult) + Send + 'static`, so the watcher passes
# a sync closure that forwards into a tokio mpsc (see watcher.rs) — no
# special debouncer feature flag needed.
notify-debouncer-full = "0.4"
# Temp dirs for file-tree backend unit tests (dev-dep on the editor crate).
tempfile = "3"
# Phase 10 — word-level diff inside the diff viewer. `similar` produces
# `TextDiff::from_words` op streams that drive per-token coloring inside
# modified-modified line pairs. Pure Rust, no `unicode-bidi` transitive
# (the `bytes` feature is the default and keeps the dep slim).
similar = "2.6"
# Phase 10.1 — syntax highlighting inside the diff body. `default-fancy`
# selects the pure-Rust `fancy-regex` engine instead of `onig` (the C
# Oniguruma binding) — avoids a `.a` link on macOS, smaller bundle, no
# extra build deps. Bundled syntaxes cover Rust/TS/Markdown/TOML/JSON
# out of the box. Loaded lazily via `LazyLock` so workspace open isn't
# blocked on the ~30 ms first-call set-load.
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }

[profile.dev]
opt-level = 0
debug = 1

# Syntax highlighting runs syntect on a `fancy-regex` (pure-Rust) backend.
# Unoptimized, its regex engine is ~10 ms per source line — a debug-build
# diff of a few hundred lines stalls the UI for ~1 s while it highlights.
# Compile just these hot crates optimized even in dev builds so highlighting
# runs at release speed; the app itself stays opt-level 0 (debuggable, fast
# incremental rebuilds). These crates rarely change, so the one-time
# optimized compile stays cached.
[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.test]
opt-level = 1
