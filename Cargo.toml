[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/core",
    "crates/pty",
    "crates/git",
    "crates/agents",
    "crates/editor",
    "crates/storage",
    "crates/settings",
    "crates/relay-proto",
    "crates/relay",
    "crates/relay-client",
    "xtask",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["nhtera"]
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.89"

[workspace.dependencies]
# Internal crates
oximux-app      = { path = "crates/app" }
oximux-core     = { path = "crates/core" }
oximux-pty      = { path = "crates/pty" }
oximux-git      = { path = "crates/git" }
oximux-agents   = { path = "crates/agents" }
oximux-editor   = { path = "crates/editor" }
oximux-storage  = { path = "crates/storage" }
oximux-settings = { path = "crates/settings" }
oximux-relay-proto = { path = "crates/relay-proto" }
oximux-relay    = { path = "crates/relay" }
oximux-relay-client = { path = "crates/relay-client" }

# GPUI — see docs/gpui-pins.md. We deliberately do NOT pin `rev` here. The
# upstream `longbridge/gpui-component` workspace pins `gpui` to the default
# branch with no rev; if we pin a rev here, cargo treats them as separate
# sources and produces two copies of `gpui::App` in the dep graph (one of
# v0.9's exact failure modes). The canonical pin lives in `Cargo.lock` —
# bump via `cargo update -p gpui -p gpui_platform -p gpui_macros` and log
# the resulting commit in `docs/gpui-pins.md`.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui_macros = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "ccc1e7689203d09bfc88a0aae29473d1c289fa0c", features = ["tree-sitter-rust"] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "ccc1e7689203d09bfc88a0aae29473d1c289fa0c" }

# Async + util
tokio = { version = "1", features = ["full"] }
anyhow = "1"
async-trait = "0.1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Phase 5 relay wire format. v2 has the cleaner config API but its
# byte layout is not ABI-stable across point releases — the workspace
# pin is the authoritative version both app + daemon agree on.
bincode = { version = "2", features = ["serde"] }
# Phase 5 relay daemon: lock-free concurrent map for PtyRegistry. Used
# only by the relay binary; declared centrally for future reuse.
dashmap = "5"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
# Daily-rotated relay daemon log (phase-07 hardening). Stays detached from
# tracing-subscriber's own rotation API to keep the dep surface minimal.
tracing-appender = "0.2"
# macOS unified-logging mirror for the relay (visible in Console.app).
tracing-oslog = "0.3"

# Phase 1-2 prep (declared centrally; pulled into crates as used)
portable-pty = "0.8"
alacritty_terminal = "0.25"
# Regex engine for the scrollback search's `.*` toggle. `unicode` features
# left off — terminal content is ASCII-dominant and the smaller binary +
# faster compile matter more than full Unicode property classes here.
regex = { version = "1", default-features = false, features = ["std", "perf"] }

# Phase 4 prep
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Phase 5 editor + LSP. Pinned to match gpui-component's transitive
# `lsp-types = "0.97"` so the `HoverProvider` trait surface (Hover,
# Diagnostic, Position) is a single concrete type across the dep graph.
# Two copies of `lsp_types` would force a conversion shim at every
# provider boundary — see docs/gpui-pins.md for the same family of
# trap the gpui crates are pinned against.
lsp-types = { version = "0.97", features = ["proposed"] }
# `url::Url::from_file_path` is the percent-encoding gate between
# `Path` and the `file://` URI rust-analyzer expects. Used by the
# editor crate's `path_to_file_uri`; paths with spaces / unicode /
# reserved chars round-trip cleanly only with proper encoding.
url = "2"
# macOS Application Support directory resolution (see crates/app/src/main.rs).
# default-features off: we only need `data_dir()` on macOS; the default
# features pull in Windows/X11 helpers we never call.
dirs = { version = "5", default-features = false }
# Native folder picker — wraps NSOpenPanel on macOS via objc2. We use
# `AsyncFileDialog` from the GPUI `cx.spawn` task so the OxiMux window
# stays responsive while the panel is open. default-features off:
# we don't need the GTK/XDG portal stacks the default features pull in
# (Linux is not a v1 target).
rfd = { version = "0.14", default-features = false }

# Phase 5 step 3 — file tree backend. `ignore` is the gitignore-aware
# walker ripgrep uses; `WalkBuilder::max_depth(Some(1))` gives lazy
# single-level enumeration. `notify-debouncer-full` drives FSEvents on
# macOS with a 200ms debounce.
ignore = "0.4"
# Re-exports its bundled `notify` at `notify_debouncer_full::notify::*`
# — depend on the debouncer and use the re-export to avoid two copies
# of `notify` in the graph (a single direct `notify = "8"` next to
# debouncer-full's pinned notify-7 silently produced trait-mismatch
# compile errors). `DebounceEventHandler` has a blanket impl for any
# `FnMut(DebounceEventResult) + Send + 'static`, so the watcher passes
# a sync closure that forwards into a tokio mpsc (see watcher.rs) — no
# special debouncer feature flag needed.
notify-debouncer-full = "0.4"
# Temp dirs for file-tree backend unit tests (dev-dep on the editor crate).
tempfile = "3"

[profile.dev]
opt-level = 0
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.test]
opt-level = 1
